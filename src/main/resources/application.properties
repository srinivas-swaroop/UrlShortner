# Step 1: Connect Spring Boot to the MySQL database.
spring.datasource.url=jdbc:mysql://localhost:3306/urlshort

# Step 2: Enter your own MySQL username and password.
spring.datasource.username=root
spring.datasource.password=Ganesha@005

# Step 3: Tell Hibernate which MySQL database dialect to use automatically.
# Spring Boot can usually detect the dialect, so this is not required.

# Step 4: Create the table automatically if it does not exist.
# Update the table structure when entity definitions change.
spring.jpa.hibernate.ddl-auto=update

# For local development. Use Flyway/Liquibase and validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Public origin used to construct links. Change this after deployment.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Gemini AI feature: set your key here or via the GEMINI_API_KEY environment variable.
gemini.api-key=google.api.key=${GOOGLE_API_KEY}

gemini.model=gemini-3.8-flash
